<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14213D"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lift Log"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Jaiden Lift Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first single column; greeting header, cards by role, fixed 5-tab bar. Navy + ember orange carried over from the printed plan */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EDF0F6; --line:#DFE4ED;
  --fg:#0E1626; --muted:#5F6879; --navy:#14213D; --navy-2:#1F2F55; --on-navy:#FFFFFF;
  --accent:#F2551B; --accent-soft:#FFEADF; --accent-ink:#B23E0E;
  --good:#1C8752; --good-soft:#DDF3E7; --warn:#B7791F; --water:#1E7FD8; --water-soft:#E1EFFC; --danger:#C53030;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif; --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0F1A; --surface:#131B2B; --surface-2:#1A2438; --line:#25314A;
  --fg:#EEF1F7; --muted:#99A3B8; --navy:#18264A; --navy-2:#22345F; --on-navy:#FFFFFF;
  --accent:#FF6A33; --accent-soft:#3A2015; --accent-ink:#FF9C75;
  --good:#3CC283; --good-soft:#12321F; --warn:#E3A33F; --water:#5AA9F0; --water-soft:#132A40; --danger:#F07070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F1A; --surface:#131B2B; --surface-2:#1A2438; --line:#25314A;
  --fg:#EEF1F7; --muted:#99A3B8; --navy:#18264A; --navy-2:#22345F; --on-navy:#FFFFFF;
  --accent:#FF6A33; --accent-soft:#3A2015; --accent-ink:#FF9C75;
  --good:#3CC283; --good-soft:#12321F; --warn:#E3A33F; --water:#5AA9F0; --water-soft:#132A40; --danger:#F07070; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello{min-width:0}
.hello small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.hello b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.wkchip{font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;white-space:nowrap}
.wkchip span{color:var(--accent)}
.sync{font-size:11px;color:var(--muted);margin-top:2px}

.st{font-size:11.5px;letter-spacing:.16em;font-weight:700;color:var(--muted);margin:24px 2px 10px;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:grid;gap:12px}
.note{font-size:13px;color:var(--muted);margin:0}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--accent);color:#fff;width:100%;font-size:15px}
label.btn{display:block;cursor:pointer}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 120px}

/* Home hero */
.hero{background:var(--navy);color:var(--on-navy);border-radius:20px;padding:18px;display:grid;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--accent);opacity:.18}
.hero>*{position:relative;z-index:1}
.eyebrow{font-size:11px;letter-spacing:.2em;font-weight:700;color:var(--accent)}
.hero h1{margin:0;font-size:28px;line-height:1.08;font-weight:800}
.hero .sub{font-size:13.5px;opacity:.85}
.hero .btn{background:var(--accent)}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);border-radius:99px;padding:4px 10px;width:max-content;max-width:100%}

.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;display:grid;gap:4px;justify-items:center}
.wd .d{font-size:11px;font-weight:700;color:var(--muted)}
.wd .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.wd .dot.train{background:var(--accent);color:#fff}
.wd .dot.cardio{background:var(--water);color:#fff}
.wd .dot.plan{background:transparent;border:2px dashed var(--line)}
.wd.today{border-color:var(--accent)}
.wd .lb{font-size:10px;color:var(--muted);line-height:1.1}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.tile .k{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.tile .v{font-size:22px;font-weight:800;line-height:1.1}
.tile .v small{font-size:13px;color:var(--muted);font-weight:600}
.bar{height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.bar.w i{background:var(--water)}
.bar.g i{background:var(--good)}
.bar.c i{background:var(--warn)}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:600}
.tips{display:grid;gap:10px}
.tip{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.tip .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.tip .ic.w{background:var(--water-soft);color:var(--water)}
.tip .ic.g{background:var(--good-soft);color:var(--good)}
.tip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tip b{display:block;font-size:14px}
.tip p{margin:0;font-size:13px;color:var(--muted)}

/* Train */
.daycards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dc{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;display:grid;gap:2px}
.dc b{font-size:15px}
.dc span{font-size:11.5px;color:var(--muted);line-height:1.3}
.dc[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.dc[aria-pressed="true"] span{color:rgba(255,255,255,.75)}
.dc .flag{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--good)}
.dc[aria-pressed="true"] .flag{color:#7EE2AE}
.progresswrap{display:grid;gap:6px}
.list{display:grid;gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex.complete{border-color:var(--good)}
.ex-h{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left}
.ex-h img{width:64px;height:64px;object-fit:cover;border-radius:12px;background:var(--surface-2)}
.ex-h .meta{min-width:0}
.ex-h h3{margin:2px 0 0;font-size:15.5px;line-height:1.2;font-weight:700}
.ex-h .rx{font-size:12.5px;color:var(--muted);font-weight:500}
.count{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.ex.complete .count{background:var(--good);color:#fff}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent-ink);border-radius:99px;padding:2px 8px}
.tag.ss{background:var(--surface-2);color:var(--muted)}
.tag.sw{background:var(--water-soft);color:var(--water)}
.ex-b{border-top:1px solid var(--line);padding:10px;display:grid;gap:8px}
.big-img{width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:var(--surface-2)}
.sugg{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
.sugg small{font-weight:600;font-size:12px}
.how{font-size:13px;color:var(--muted);margin:0}
.sethead,.setrow{display:grid;grid-template-columns:30px 1fr 1fr 50px;gap:8px;align-items:center}
.sethead{font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--muted);text-transform:uppercase}
.setrow .n{font-weight:700;color:var(--muted);text-align:center}
.setrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 6px;font-size:16px;font-weight:600;text-align:center}
.setrow input::placeholder{color:var(--muted);font-weight:500;opacity:.75}
.chk{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.chk svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.setrow.done .chk{background:var(--good);border-color:var(--good)}
.setrow.done .chk svg{stroke:#fff}
.setrow.done input{border-color:var(--good-soft);background:var(--good-soft)}
.prev{font-size:12px;color:var(--muted)}
.swapbox{display:grid;gap:6px;background:var(--surface-2);border-radius:12px;padding:10px}
.swapbox select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-size:15px;width:100%;min-width:0}
.linkbtn{border:0;background:none;color:var(--accent-ink);font-weight:700;font-size:13px;padding:4px 0;text-align:left}
.core-moves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.core-moves figure{margin:0;display:grid;gap:4px}
.core-moves img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.core-moves figcaption{font-size:12px;font-weight:600;line-height:1.25}
.core-moves figcaption span{display:block;color:var(--muted);font-weight:500}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 8px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.seg.good button[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}

/* Rest timer + tabs */
.rest{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:6;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.rest .inner{max-width:640px;margin:0 auto;background:var(--navy);color:var(--on-navy);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.rest .t{font-size:26px;font-weight:800;min-width:72px}
.rest .l{flex:1;min-width:0;font-size:12px;opacity:.85;line-height:1.3}
.rest button{background:rgba(255,255,255,.14);border:0;color:var(--on-navy);border-radius:9px;padding:8px 10px;font-weight:600;font-size:13px}
.rest.over .t{color:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs a{display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:10px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}

/* Food */
.ring-row{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:22px;font-weight:800;line-height:1}
.ring .c span{font-size:11px;color:var(--muted);font-weight:600}
.macros{display:grid;gap:10px;min-width:0}
.macro .top{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:600}
.macro .top span:last-child{color:var(--muted);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 10px;font-size:12.5px;font-weight:600;text-align:left}
.chips button small{color:var(--muted);font-weight:500}
.meal .it{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.meal .it .m{color:var(--muted);font-size:12px}
.xbtn{border:0;background:var(--surface-2);border-radius:9px;width:32px;height:32px;font-weight:700;color:var(--muted);display:grid;place-items:center}
.field{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;font-size:16px;color:var(--fg);width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent-ink)}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.stat b{display:block;font-size:19px;font-weight:800}
.stat span{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.chart svg{width:100%;height:auto;display:block}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:22px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.hist .h{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.hist .d{font-size:12.5px;color:var(--muted)}
.plan-day .r{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.plan-day .r span:last-child{color:var(--muted);white-space:nowrap}
.phase-row{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px;border-radius:8px;font-size:13.5px}
.phase-row b{color:var(--accent-ink)}
.phase-row.now{background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:20;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;max-width:calc(100% - 32px)}
@media (max-width:380px){.tiles{grid-template-columns:1fr}.ring-row{grid-template-columns:1fr;justify-items:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="hello"><small id="greet">Hello,</small><b id="hname">Jaiden</b><div class="sync" id="sync">Loading your data…</div></div>
    <div class="wkchip num" id="wk"></div>
  </header>
  <main id="view"></main>
</div>

<div class="rest" id="rest" hidden>
  <div class="inner">
    <div class="t num" id="restT">2:00</div>
    <div class="l" id="restL">Rest</div>
    <button id="restAdd" type="button">+15s</button>
    <button id="restSkip" type="button">Skip</button>
  </div>
</div>

<nav class="tabs" aria-label="Sections"><div class="inner">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</a>
  <a href="#train" data-tab="train"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Train</a>
  <a href="#food" data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M16 3c-2 2-2 6 0 8v10"/></svg>Food</a>
  <a href="#progress" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progress</a>
  <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg>Plan</a>
</div></nav>

<script>
/* ================= Program ================= */
const EX = {
  "incline-smith":{n:"Incline Smith Press",tag:"Upper chest",s:4,lo:6,hi:8,rest:150,u:"kg total",inc:2.5,start:50,tip:"Bench at 30°. Bar touches upper chest 2–3 fingers below the collarbone, elbows about 45°."},
  "low-row":{n:"Seated Cable Row (Low Row)",tag:"Mid back",s:4,lo:8,hi:10,rest:120,u:"kg",inc:5,start:40,tip:"Sit tall, pull to your stomach, squeeze shoulder blades for 1 sec. No rocking."},
  "shoulder-press":{n:"Machine Shoulder Press",tag:"Shoulders",s:3,lo:8,hi:10,rest:90,u:"kg",inc:2.5,start:25,tip:"Handles start at ear height. Press without locking out; back flat on the pad."},
  "wide-pulldown":{n:"Wide-Grip Lat Pulldown",tag:"Lats",s:3,lo:10,hi:12,rest:90,u:"kg",inc:5,start:40,tip:"Chest up, drive elbows down to your ribs, pause at the bottom."},
  "chest-press":{n:"Machine Chest Press",tag:"Chest",s:3,lo:10,hi:12,rest:90,u:"kg",inc:5,start:35,tip:"Handles at mid-chest. Press out, take 3 seconds on the way back."},
  "seated-lateral":{n:"Seated Dumbbell Lateral Raise",tag:"Side delts",s:3,lo:12,hi:15,rest:60,u:"kg each",inc:1,start:6,tip:"Lead with the elbows to shoulder height, no swinging. Drop set on the last set."},
  "rope-pushdown":{n:"Rope Pushdown",tag:"Triceps",ss:"Superset · straight into the next one",s:3,lo:10,hi:12,rest:0,u:"kg",inc:2.5,start:17.5,tip:"Elbows pinned at your sides, split the rope at the bottom."},

const state={sessions:{},bw:{},food:{},daily:{},settings:{start:DEFAULT_START,name:"Jaiden"},ready:false,mode:"local"};

function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||localStorage.getItem("liftlog.v1")||"null");if(v){state.sessions=v.sessions||{};state.bw=v.bw||{};state.food=v.food||{};state.daily=v.daily||{};state.settings=Object.assign({start:DEFAULT_START,name:"Jaiden"},v.settings||{})}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({sessions:state.sessions,bw:state.bw,food:state.food,daily:state.daily,settings:state.settings}))}catch(e){}}
const queues={},timers={},pending={sessions:new Set(),food:new Set(),daily:new Set()};
function queueWrite(path,fn){const p=(queues[path]||Promise.resolve()).then(fn).catch(err=>{console.error(err);toast(err&&err.code==="quota_exceeded"?"Storage is full. Delete old workouts in Progress.":"Couldn't sync. Your changes are kept on this device.")});queues[path]=p;return p}
function saveDoc(coll,id,delay=500){
  lsSave();if(!db)return;pending[coll].add(id);clearTimeout(timers[coll+id]);
  timers[coll+id]=setTimeout(()=>{const src=state[coll==="sessions"?"sessions":coll][id];if(!src){pending[coll].delete(id);return}
    const body=JSON.parse(JSON.stringify(src));queueWrite(coll+"/"+id,()=>db.doc(coll+"/"+id).set(body)).then(()=>pending[coll].delete(id))},delay);
}
function delDoc(coll,id){lsSave();if(db)queueWrite(coll+"/"+id,()=>db.doc(coll+"/"+id).delete())}
function saveBW(date,lb){state.bw[date]={date,lb};lsSave();if(db)queueWrite("bodyweight/"+date,()=>db.doc("bodyweight/"+date).set({date,lb}))}
function saveSettings(){lsSave();if(db){const b={...state.settings};queueWrite("settings/main",()=>db.doc("settings/main").set(b))}}

async function connect(){
  lsLoad();render();
  let d=null;try{d=window.claude?await window.claude.use("db"):null}catch(e){d=null}
  if(!d){d=await selfHostDb();if(d)state.mode="self"}else state.mode="cloud";
  if(!d){state.mode="local";state.ready=true;$("#sync").textContent="Saved on this device";render();return}
  db=d;let got=new Set();
  const timer=setTimeout(()=>{if(!state.ready)$("#sync").textContent="Can't reach your saved data yet"},10000);
  const done=(name,snap)=>{if(snap&&snap.metadata&&!snap.metadata.fromCache){got.add(name);if(got.size>=5&&!state.ready){state.ready=true;clearTimeout(timer);$("#sync").textContent=state.mode==="self"?"Synced to your server":"Synced to your account"}}};
  const fail=()=>{clearTimeout(timer);$("#sync").textContent="Sync paused · saved on this device"};
  if(state.mode==="self")$("#sync").textContent="Synced to your server";
  const sub=(coll,key)=>db.collection(coll).onSnapshot(s=>{if(s.docs.length||!s.metadata.fromCache){const n={};s.docs.forEach(x=>n[x.id]=x.data());if(pending[key])pending[key].forEach(k=>{if(state[key][k])n[k]=state[key][k]});state[key]=n;lsSave()}done(coll,s);render(true)},fail);
  sub("sessions","sessions");sub("bodyweight","bw");sub("food","food");sub("daily","daily");
  db.doc("settings/main").onSnapshot(s=>{if(s.exists)state.settings=Object.assign({start:DEFAULT_START,name:"Jaiden"},s.data());done("settings",s);render(true)},fail);
}

/* Own-server mode: same calls as Claude's db, backed by /api on the VPS */
async function selfHostDb(){
  if(location.protocol==="file:")return null;
  let first;try{const r=await fetch("/api/all",{credentials:"same-origin",cache:"no-store"});if(!r.ok)return null;first=await r.json()}catch(e){return null}
  let store=first.store||{};const subs=[];
  const snapOf=(id,data)=>({id,exists:data!==undefined,data:()=>data,metadata:{fromCache:false,hasPendingWrites:false}});
  const emit=()=>subs.forEach(s=>{try{s()}catch(e){}});
  async function refresh(){try{const r=await fetch("/api/all",{credentials:"same-origin",cache:"no-store"});if(r.status===401){location.reload();return}if(r.ok){store=(await r.json()).store||{};emit()}}catch(e){}}
  setInterval(()=>{if(document.visibilityState==="visible")refresh()},20000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});
  async function call(method,coll,id,body){const r=await fetch(`/api/doc/${encodeURIComponent(coll)}/${encodeURIComponent(id)}`,{method,credentials:"same-origin",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
    if(r.status===401){location.reload();throw{code:"revoked"}}if(!r.ok)throw{code:"unavailable"}
    if(method==="PUT")(store[coll]=store[coll]||{})[id]=body;else if(store[coll])delete store[coll][id]}
  return{
    doc(pth){const [coll,id]=pth.split("/");return{
      set:b=>call("PUT",coll,id,b),delete:()=>call("DELETE",coll,id),
      onSnapshot(next){const f=()=>next(snapOf(id,(store[coll]||{})[id]));subs.push(f);f();return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}}},
    collection(coll){return{onSnapshot(next){const f=()=>{const docs=Object.entries(store[coll]||{}).map(([id,v])=>snapOf(id,v));next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}})};subs.push(f);f();return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}}},
    async importAll(data){const r=await fetch("/api/import",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});if(!r.ok)throw{code:"unavailable"};await refresh()}
  };
}

}
async function doImport(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast("That file isn't a Lift Log backup");return}
  if(!data||data.app!=="liftlog"){toast("That file isn't a Lift Log backup");return}
  const map={sessions:"sessions",bodyweight:"bw",food:"food",daily:"daily"};let n=0;
  for(const [coll,key] of Object.entries(map)){for(const [id,doc] of Object.entries(data[coll]||{})){state[key][id]=doc;n++}}
  if(data.settings&&data.settings.main)state.settings=Object.assign({},state.settings,data.settings.main);
  lsSave();
  try{
    if(db&&db.importAll){await db.importAll({sessions:data.sessions||{},bodyweight:data.bodyweight||{},food:data.food||{},daily:data.daily||{},settings:{main:state.settings}})}
    else if(db){for(const [coll,key] of Object.entries(map)){for(const id of Object.keys(data[coll]||{})){const body=JSON.parse(JSON.stringify(state[key][id]));await queueWrite(coll+"/"+id,()=>db.doc(coll+"/"+id).set(body))}}saveSettings()}
    toast(`Imported ${n} records`)
  }catch(e){toast("Import saved on this device, but couldn't sync")}
  render();
}

/* ================= Derived ================= */
function sessionsSorted(){return Object.entries(state.sessions).map(([id,v])=>({id,...v})).sort((a,b)=>(b.date+(b.ts||0)).localeCompare(a.date+(a.ts||0)))}
function doneSets(s){let n=0;Object.values(s.sets||{}).forEach(a=>a.forEach(x=>{if(x&&x.done)n++}));return n}
function trainedOn(date){return sessionsSorted().filter(s=>s.date===date&&doneSets(s)>0)}
function lastFor(key,excludeId){for(const s of sessionsSorted()){if(s.id===excludeId)continue;const sets=(s.sets&&s.sets[key]||[]).filter(x=>x&&x.done&&x.r>0);if(sets.length)return{s,sets}}return null}
function suggestion(key,target,ph,excludeId){
  const e=EX[key];const last=lastFor(key,excludeId);
  if(!last)return{w:e.start,why:"start",last:null};

}
function bestSet(key){let best=null;for(const s of sessionsSorted()){(s.sets&&s.sets[key]||[]).forEach(x=>{if(x&&x.done&&x.r>0){const w=Number(x.w)||0;if(!best||w>best.w||(w===best.w&&x.r>best.r))best={w,r:x.r,date:s.date}}})}return best}

/* What kind of day is it? Flexible: missed workouts roll forward. */
function dayPlan(date){
  const today=trainedOn(date);
  if(today.length)return{type:"train",day:today[0].day,done:true};
  const doneW=weekDoneDays(date);const next=ORDER.find(k=>!doneW.has(k));
  const dow=parseISO(date).getDay();const streak=streakBefore(date);
  const daysLeft=(7-((dow+6)%7));const left=ORDER.filter(k=>!doneW.has(k)).length;
  if(next&&streak<2&&dow!==0&&(DAYS[next].dow===dow||[1,2,4,5].includes(dow)||left>=daysLeft-1))return{type:"train",day:next};

function targets(date){
  const st=state.settings;const lb=latestBW();const kg=lb*0.4536;const cm=(Number(st.heightIn)||67)*2.54;const age=Number(st.age)||22;
  const bmr=10*kg+6.25*cm-5*age+(st.sex==="female"?-161:5);
  const act=(ACT.find(a=>a[0]===(st.activity||"moderate"))||ACT[1])[2];
  const goal=(GOALS.find(g=>g[0]===(st.goal||"gain"))||GOALS[0]);const adj=Number(st.kcalAdj)||0;
  const base=bmr*act+goal[2]+adj;const t=date?dayTypeFor(date):"avg";
  const shift=t==="train"?150:t==="avg"?0:-200;
  const kcal=Math.round((base+shift)/10)*10;
  const p=Math.round(lb*(goal[0]==="lean"?1.1:1.0));const f=Math.round(kcal*0.25/9);const c=Math.max(0,Math.round((kcal-p*4-f*9)/4));

}
function trendAdvice(){
  const bws=Object.values(state.bw).sort((a,b)=>a.date.localeCompare(b.date));if(bws.length<2)return null;
  const last=bws[bws.length-1];const cutoff=addDays(last.date,-21);const first=bws.find(b=>b.date>=cutoff)||bws[0];
  const days=(parseISO(last.date)-parseISO(first.date))/86400000;if(days<10)return null;
  const perWk=(last.lb-first.lb)/days*7;const g=state.settings.goal||"gain";

}

function lineChart(points,{unit=""}={}){
  if(points.length<2)return `<div class="empty">Log this ${points.length?"one more time":"twice"} to see your line.</div>`;
  const W=600,H=180,L=44,R=16,T=18,B=26;const ys=points.map(p=>p.y);
  let min=Math.min(...ys),max=Math.max(...ys);if(min===max){min-=1;max+=1}const pv=(max-min)*0.15;min-=pv;max+=pv;
  const X=i=>L+(W-L-R)*(i/(points.length-1));const Y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  const ticks=[min+pv,(min+max)/2,max-pv];const path=points.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(p.y).toFixed(1)).join("");
  const last=points[points.length-1];const lbl=[0,Math.floor((points.length-1)/2),points.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Poppins,sans-serif">${fmtW(Math.round(t*10)/10)}</text>`).join("")}
    <path d="${path}L${X(points.length-1)},${H-B}L${L},${H-B}Z" fill="var(--accent)" opacity=".12"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${points.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===points.length-1?5:3}" fill="${i===points.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("")}
    ${lbl.map(i=>`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?"start":i===points.length-1?"end":"middle"}" font-size="11" fill="var(--muted)" font-family="Poppins,sans-serif">${esc(parseISO(points[i].date).toLocaleDateString(undefined,{day:"numeric",month:"short"}))}</text>`).join("")}
    <text x="${W-R}" y="${Math.max(Y(last.y)-10,12)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--fg)" font-family="Poppins,sans-serif">${fmtW(last.y)}${unit}</text></svg></div>`;
}

  if(b.id==="askBtn"){askClaude();return}

  if(b.dataset.applyadj){state.settings.kcalAdj=(Number(state.settings.kcalAdj)||0)+Number(b.dataset.applyadj);saveSettings();render();toast("Target updated");return}

    const its=(out&&out.items)||[];if(!its.length)throw new Error("none");const d=foodDate;state.food[d]=state.food[d]||{date:d,items:[]};
    state.food[d].items=[...(state.food[d].items||[]),...its.map(x=>({name:String(x.name).slice(0,80),serv:String(x.serv||"").slice(0,40),kcal:Math.max(0,+x.kcal||0),p:Math.max(0,+x.p||0),c:Math.max(0,+x.c||0),f:Math.max(0,+x.f||0),meal:foodMeal||defaultMeal(),est:true,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)}))];

/* ================= Rest timer ================= */
let restEnd=0,restInt=null,wake=null;
function startRest(sec,label){restEnd=Date.now()+sec*1000;$("#restL").textContent=label+" · rest "+restTxt(sec);$("#rest").hidden=false;$("#rest").classList.remove("over");clearInterval(restInt);restInt=setInterval(tickRest,250);tickRest();
  try{if(navigator.wakeLock&&!wake)navigator.wakeLock.request("screen").then(l=>{wake=l;l.addEventListener("release",()=>wake=null)}).catch(()=>{})}catch(e){}}
function tickRest(){const ms=restEnd-Date.now();const s=Math.abs(Math.round(ms/1000));$("#restT").textContent=(ms<0?"+":"")+Math.floor(s/60)+":"+pad(s%60);
  if(ms<=0&&!$("#rest").classList.contains("over")){$("#rest").classList.add("over");$("#restL").textContent="Rest's up. Next set.";try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  if(ms<-120000)stopRest()}
function stopRest(){clearInterval(restInt);$("#rest").hidden=true;try{wake&&wake.release()}catch(e){}}
let toastT=null;
function toast(msg){let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}
setInterval(()=>{if(!document.activeElement||!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))$("#greet").textContent=greeting()},60000);

connect();
(async()=>{try{const sm=window.claude?await window.claude.use("sample"):null;if(sm){sample=sm;if(tab()==="food")render()}}catch(e){}})();
</script>

</body></html>
