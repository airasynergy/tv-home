name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --console=plain 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |^w: .*error|error:|Error:|What went wrong|^> [^T]|^\* What|FAILED" build.log | grep -v "> Task" | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: TVHome-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish direct download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk TVHome.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TVHome.apk --title "TV Home (latest build)" --notes "Built from ${GITHUB_SHA::7}" --latest
